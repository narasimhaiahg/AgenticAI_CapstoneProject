<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="~{fragments/layout :: head('Cases')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main id="main">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="row-between">
        <h1>Fraud cases</h1>
        <a class="button primary" th:href="@{/ui/cases/new}" sec:authorize="hasAnyRole('AGENT','INVESTIGATOR','LEAD')">New case</a>
    </div>
    <p th:if="${#lists.isEmpty(cases)}" class="empty">No cases yet. Create one from the intake screen.</p>
    <div class="table-wrap" th:unless="${#lists.isEmpty(cases)}">
        <table>
            <caption class="sr-only">Cases ordered by report time</caption>
            <thead><tr><th scope="col">Case</th><th scope="col">Status</th><th scope="col">Customer</th><th scope="col">Classification</th>
                <th scope="col">Recommended route</th><th scope="col">Assigned route</th><th scope="col">Reported</th></tr></thead>
            <tbody>
            <tr th:each="c : ${cases}" th:with="r=${latest.get(c.caseId)}">
                <td><a th:href="@{/ui/cases/{id}/investigation(id=${c.caseId})}" th:text="${c.caseId}">id</a></td>
                <td><span class="status" th:classappend="'status-' + ${#strings.toLowerCase(c.status)}" th:text="${c.status}">s</span></td>
                <td th:text="${c.maskedCustomerRef}">ref</td>
                <td th:text="${r != null} ? ${r.classification} : '—'">-</td>
                <td th:text="${r != null} ? ${r.route} : '—'">-</td>
                <td th:text="${c.assignedRoute != null} ? ${c.assignedRoute} : '—'">-</td>
                <td th:text="${#temporals.format(c.reportedAt, 'yyyy-MM-dd HH:mm')} + ' UTC'">t</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
